<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="platformercss.css">
    <script src="platformerjs.js" defer></script>
    <title>Platformer</title>
</head>
<body>
    <div class="background">
        <div id="world">
            <div id="ground"></div>
            <div id="player"></div>
        </div>
        <div id="lava"></div>
        <div id="hud">Height: 0 m</div>
        <div id="abilities">
            <div class="ability" id="dashAbility">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
                    <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
                    <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
                </svg>
                <div class="ability-fill"></div>
                <div class="ability-time"></div>
            </div>
            <div class="ability" id="doubleJumpAbility">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m17 11-5-5-5 5"/>
                    <path d="m17 18-5-5-5 5"/>
                </svg>
                <div class="ability-fill"></div>
                <div class="ability-time"></div>
            </div>
        </div>
        <div id="gameOver">
            <h1>You burned</h1>
            <p id="finalScore"></p>
            <p>Press R to try again</p>
        </div>
        <div id="countdown"></div>
    </div>
</body>
</html>
